[build]
  publish = "dist"
  command = "npm run build"

# Legacy blueprint links (/project.html?id=…) move permanently to the
# pre-rendered /projects/<id>/ pages so search ranking carries over.
[[redirects]]
  from = "/project.html"
  to = "/projects/:id/"
  status = 301
  force = true
  query = {id = ":id"}

[[redirects]]
  from = "/project"
  to = "/projects/:id/"
  status = 301
  force = true
  query = {id = ":id"}

[[redirects]]
  from = "/projects"
  to = "/#work"
  status = 301
  force = true

[[redirects]]
  from = "/project"
  to = "/#work"
  status = 301

# Clean URLs & Page Routing
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Security & Optimization Headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static hashed assets for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Plain-text files for AI assistants and crawlers
[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
